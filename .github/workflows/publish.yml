name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0, or "from-package" to use package.json version)'
        required: false
        default: 'from-package'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Update version (if specified)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'from-package'
        run: bunx npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Update version from release tag
        if: github.event_name == 'release'
        run: bunx npm version ${GITHUB_REF_NAME#v} --no-git-tag-version

      - name: Publish to npm
        run: bunx npm publish --access public
